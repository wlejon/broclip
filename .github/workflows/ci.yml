name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# broclip's backends are the Wayland data-control protocol (Linux), the Win32
# clipboard and the macOS pasteboard. The tests run the manager and the API on
# an in-memory backend, so no job touches a real clipboard. The binding
# (broclip_api) binds bronze, so every job lays out ../bronze and ../brass with
# bronze's checkout-toolchain action.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,          os: ubuntu-24.04, config: Release }
          - { name: windows-msvc,       os: windows-2022, config: Release }
          # Debug CRT: iterator debugging and the library's own assert()s.
          - { name: windows-msvc-debug, os: windows-2022, config: Debug }
          - { name: macos-arm64,        os: macos-15,     config: Release }
    steps:
      - uses: actions/checkout@v7
        with:
          path: broclip

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libwayland-dev libwayland-bin

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S broclip -B build
          else
            cmake -S broclip -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
